# xcodegen project descriptor for the Harness macOS .app target.
# Run `xcodegen generate` from this directory to (re)materialise Harness.xcodeproj,
# or invoke `scripts/build-app.sh` to do that as part of the packaging pipeline.

name: Harness
options:
  bundleIdPrefix: com.harness
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    # Local-dev signing defaults: an unsigned/ad-hoc build runs on the
    # developer's machine without a paid identity. scripts/sign.sh
    # re-signs with HARNESS_SIGN_IDENTITY when shipping.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  Harness:
    type: application
    platform: macOS
    sources:
      - path: Sources/Harness
        excludes:
          - "**/*.md"
          - "Resources/Info.plist"
          - "Resources/Harness.entitlements"
    resources:
      - path: Sources/Harness/Resources
        excludes:
          - "Info.plist"
          - "Harness.entitlements"
    info:
      path: Sources/Harness/Resources/Info.plist
      properties:
        CFBundleName: Harness
        CFBundleDisplayName: Harness
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harness.Harness
        PRODUCT_NAME: Harness
        CODE_SIGN_ENTITLEMENTS: Sources/Harness/Resources/Harness.entitlements

  HarnessUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests/HarnessUITests
    dependencies:
      - target: Harness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harness.HarnessUITests
        TEST_TARGET_NAME: Harness
        # The XCUITest runner launches a separate process; signing it
        # ad-hoc keeps `make uitest` working without a paid identity.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"

schemes:
  HarnessUITests:
    build:
      targets:
        Harness: all
        HarnessUITests: all
    test:
      targets:
        - HarnessUITests
