[package]
name = "harness-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "HTTP+SSE server binary for Harness."

[lib]
name = "harness_server"
path = "src/lib.rs"

[[bin]]
name = "harness-server"
path = "src/main.rs"

[dependencies]
# Composition root: depends on every adapter (per PLAN §2.5). T1.L wires
# storage + sandbox endpoints; orchestrator / providers wiring lands in T1.E
# but the deps are listed here so the crate graph is stable across phases.
harness-core.workspace = true
harness-storage.workspace = true
harness-sandbox.workspace = true
harness-orchestrator.workspace = true
harness-tools.workspace = true
harness-providers.workspace = true

axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

uuid.workspace = true
once_cell.workspace = true
bytes.workspace = true
chrono.workspace = true
async-trait.workspace = true
base64 = "0.22"
async-stream = "0.3"

[dev-dependencies]
reqwest.workspace = true
eventsource-stream.workspace = true
tempfile.workspace = true
pretty_assertions.workspace = true
http-body-util = "0.1"
tower = { workspace = true, features = ["util"] }
